appId: sh.omp.studio
productName: OMP Studio
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
copyright: Copyright (c) 2026 Can Boluk
asar: true
compression: maximum
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - package.json
extraResources:
  - from: resources
    to: omp-server
    filter:
      - omp
      - omp.exe
  - from: resources/tray-icon.png
    to: tray-icon.png
# afterPack fails the build when a packaged tree is missing the sidecar, the
# tray icon, or the bundled scripts; afterSign notarizes the macOS bundle when
# the Apple credentials are present and skips cleanly when they are not.
afterPack: ./scripts/after-pack.cjs
afterSign: ./scripts/notarize.cjs
win:
  icon: resources/icon.ico
  target:
    - nsis
mac:
  icon: resources/icon.icns
  # Hardened runtime plus the three entitlements the bundled Bun sidecar needs:
  # it executes JIT, allocates executable memory, and loads native
  # pi_natives.*.node modules that are not signed by Apple.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  target:
    - dmg
    - zip
linux:
  icon: resources/icon.png
  target:
    - AppImage
    - deb
